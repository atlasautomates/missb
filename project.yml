# Miss B watch app. Regenerate with scripts/generate-xcodeproj.sh.
# Display name "Miss B" is CFBundleDisplayName; the target stays MissB so
# paths and the scheme have no spaces. Bundle id ends in .missb.
# Team id is not stored here — the generator writes Config/Signing.xcconfig
# from .env's APPLE_TEAM_ID when that file exists, and leaves the team unset
# otherwise so simulator builds still work.
# AuditModel is the domain package. The watch target links it and does not
# reimplement sheet rules.
# MissBWidget is the watch-face complication. It shares an app group with
# the watch app so the face can read the census countdown.
name: MissB
packages:
  AuditModel:
    path: AuditModel
options:
  bundleIdPrefix: com.atlasautomates
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  MissB:
    type: application
    platform: watchOS
    dependencies:
      - package: AuditModel
        product: AuditModel
      - target: MissBWidget
        embed: true
    sources:
      - path: WatchApp
        excludes:
          - Background.plist
      - path: Shared
    entitlements:
      path: WatchApp/MissB.entitlements
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasautomates.missb
        PRODUCT_NAME: MissB
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Miss B"
        INFOPLIST_KEY_WKApplication: YES
        INFOPLIST_KEY_WKWatchOnly: YES
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        INFOPLIST_FILE: WatchApp/Background.plist
    scheme: {}
  MissBWidget:
    type: app-extension
    platform: watchOS
    dependencies:
      - package: AuditModel
        product: AuditModel
    sources:
      - path: Complication
        excludes:
          - Info.plist
          - MissBWidget.entitlements
      - path: Shared
    entitlements:
      path: Complication/MissBWidget.entitlements
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.atlasautomates.missb.widget
        PRODUCT_NAME: MissBWidget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Complication/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: "Miss B"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
